esphome:
  name: emv3lite
  friendly_name: EMV3Lite
  includes:
    - wifi_icon.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

api:
  encryption:
    key: "IAdy5njnkBVj9bkisMaYf4YoWwwzkwb1JKsUjRC5Rt8="

ota:
  - platform: esphome
    password: "e879538003a80e02cb630aafd793278e"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Emv3Lite Fallback Hotspot"
    password: "rYPRtzKwaRy3"

captive_portal:

time:
  - platform: homeassistant
    id: esptime

one_wire:
  - platform: gpio
    pin: GPIO17  

# i2c bus for ADS1115
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 800kHz
  id: bus_a

#ADS1115 A/D convertor
ads1115:
  - address: 0x48
    id: ads1115_48
    continuous_mode: off

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength in %
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    id: wifi_signal_pct
    update_interval: 60s
    entity_category: "diagnostic"

  # high speed input for engine rpm, opto isolated input 12V capable
  - platform: pulse_counter
    pin: GPIO27
    id: hertz
    name: "Frequency Sensor"
    unit_of_measurement: "Hz"
    # Update interval
    update_interval: 5s
    filters:
        - multiply: 0.0167
  
  # analog input for oil pressure, resistor divider allows for 5V pressure transducer  
  - platform: adc
    pin: GPIO34
    name: "Oil Pressure Input"
    id: OilPres
    update_interval: 1s

  # ads1115 analog inputs, resistor divider allows for input range of 0-18V
  # ads1115-48 A0
  - name: "AN0"
    id: ads1115_48_a0
    ads1115_id: ads1115_48
    multiplexer: 'A0_GND'
    gain: 4.096
    platform: ads1115
    update_interval: 1s
    unit_of_measurement: "V"
    icon: "mdi:gauge"

  # ads1115-48 A1
  - name: "AN1"
    id: ads1115_48_a1
    ads1115_id: ads1115_48
    multiplexer: 'A1_GND'
    gain: 4.096
    platform: ads1115
    update_interval: 1s
    unit_of_measurement: "V"
    icon: "mdi:gauge"

# ads1115-48 A2
  - name: "AN2"
    id: ads1115_48_a2
    ads1115_id: ads1115_48
    multiplexer: 'A2_GND'
    gain: 4.096
    platform: ads1115
    update_interval: 1s
    unit_of_measurement: "V"
    icon: "mdi:gauge"

# ads1115-48 A3
  - name: "AN3"
    id: ads1115_48_a3
    ads1115_id: ads1115_48
    multiplexer: 'A3_GND'
    gain: 4.096
    platform: ads1115
    update_interval: 1s
    unit_of_measurement: "V"
    icon: "mdi:gauge"

# on board 1wire temperature sensor, DS18B20
  - name: "SumpTemperature"
    id: SumpTempVal
    platform: dallas_temp
    index: 0
    update_interval: 30s

# digital inputs x 2, opto isolated, 12V capable
binary_sensor:
  - platform: gpio
    id: Din1
    pin:
      number: GPIO13
      inverted: true
      mode:
        input: true
        pulldown: true
    name: "Digital Input 1"

  - platform: gpio
    id: Din2
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pulldown: true
    name: "Digital Input 2"

# digital output, form c relay
switch:
  # relay output 1
  - platform: gpio
    name: Relay1
    pin:
      number: GPIO26
      inverted: false
      mode: output
    restore_mode: ALWAYS_OFF
    id: Dout1

cover:
- platform: template
  name: Relay Control
  lambda: !lambda |-
    // example on how to control the relay using freq 
    // if freq > 260hz turn on relay 1
    if (id(hertz).state > 260) {
      id(Dout1).turn_on();        
    } else {
      id(Dout1).turn_off();
    }
    return 0;

