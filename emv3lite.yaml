      // set background
      it.filled_rectangle(0,  0, it.get_width(), it.get_height(), id(my_background));
      
      // display time
      it.strftime(10, 10, id(font2), id(my_white), TextAlign::TOP_LEFT, "%A %d %b", id(esptime).now());
      // Print time in HH:MM format
